name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode version
        run: xcodebuild -version

      - name: Validate project
        run: xcodebuild -project ios/Kyntral.xcodeproj -list

      - name: Build iOS simulator app
        run: >-
          xcodebuild
          -project ios/Kyntral.xcodeproj
          -scheme Kyntral
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build
