name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ios-build-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record toolchain and verify target membership
        run: |
          mkdir -p artifacts/ios
          git rev-parse HEAD | tee artifacts/ios/source-commit.txt
          xcodebuild -version | tee artifacts/ios/xcode-version.txt
          xcrun simctl list devices available -j > artifacts/ios/simulators.json
          python3 scripts/verify-ios-evidence.py --manifest artifacts/ios/source-tests.json

      - name: Execute all Kyntral XTests
        run: |
          SIMULATOR_ID="$(jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone"))) | .udid][0] // empty' artifacts/ios/simulators.json)"
          test -n "$SIMULATOR_ID"
          echo "$SIMULATOR_ID" > artifacts/ios/simulator-id.txt
          xcodebuild \
            -project ios/Kyntral.xcodeproj \
            -scheme Kyntral \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath artifacts/ios/Kyntral.xcresult \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            test 2>&1 | tee artifacts/ios/xcodebuild-test.log

      - name: Verify every expected XCTest executed and passed
        if: always()
        run: |
          xcrun xcresulttool get test-results tests \
            --path artifacts/ios/Kyntral.xcresult \
            --compact > artifacts/ios/test-results.json
          python3 scripts/verify-ios-evidence.py --xcresult-json artifacts/ios/test-results.json

      - name: Retain Xcode result bundle and execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ios/
          if-no-files-found: error
          retention-days: 30
