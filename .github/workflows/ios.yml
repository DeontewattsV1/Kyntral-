name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "control-plane/src/time.ts"
      - "protocol/**"
      - "conformance/**"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "control-plane/src/time.ts"
      - "protocol/**"
      - "conformance/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  ios-build-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select latest installed Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build and test Kyntral iOS
        run: |
          set -euo pipefail
          SIMULATOR_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone"))) | .udid][0] // empty')"
          if [[ -z "$SIMULATOR_ID" ]]; then
            echo "No available iPhone simulator for the selected Xcode toolchain" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on iPhone simulator: $SIMULATOR_ID"
          xcodebuild \
            -project ios/Kyntral.xcodeproj \
            -scheme Kyntral \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            test
