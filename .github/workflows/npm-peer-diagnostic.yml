name: npm peer-resolution diagnostic (no release)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/npm-peer-diagnostic.yml"
      - "scripts/npm_peer_diagnostic.py"

permissions:
  contents: read

jobs:
  npm-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Select pinned Node and npm toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Capture npm peer-resolution stack and isolate exact package graph
        run: python3 scripts/npm_peer_diagnostic.py --output artifacts/npm-diagnostic
      - name: Retain redacted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-diagnostic-${{ github.event.pull_request.head.sha }}
          path: artifacts/npm-diagnostic/
          if-no-files-found: error
          retention-days: 14


  npm11-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Select pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
          package-manager-cache: false
      - name: Pin and capture independent npm 11.19.1 comparison
        run: |
          mkdir -p artifacts/npm11
          git rev-parse HEAD > artifacts/npm11/source-commit.txt
          node --version > artifacts/npm11/node-version.txt
          npm install --global npm@11.19.1
          npm --version | tee artifacts/npm11/npm-version.txt
          test "$(npm --version)" = "11.19.1"
      - name: Resolve unchanged Kyntral dependencies
        run: |
          npm install
          cp package-lock.json artifacts/npm11/package-lock.json
      - name: Dependency audit
        run: npm run security:audit
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: MCP transport and authorization
        run: npm run test:mcp
      - name: Protocol conformance
        run: npm run conformance
      - name: Generate CycloneDX SBOM
        run: |
          npm sbom --sbom-format=cyclonedx > artifacts/npm11/sbom.cdx.json
          test -s artifacts/npm11/sbom.cdx.json
      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm11-comparison-${{ github.event.pull_request.head.sha }}
          path: artifacts/npm11/
          if-no-files-found: error
          retention-days: 14
